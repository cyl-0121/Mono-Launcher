name: site-check

# 每天检查一次：GitHub Release 的下载链接是否还能用；如果配置了站点地址，也检查站点。
# 失败会在 Actions 里标红，并（可选）开一个 issue。
on:
  schedule:
    # UTC 01:00 = 北京时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub release asset
        id: release
        run: |
          url="https://github.com/cyl-0121/Mono-Launcher/releases/download/v0.9.0/MonoLauncher-win-x64.zip"
          code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
          echo "release_http=$code"
          if [ "$code" != "200" ]; then
            echo "::error::Release asset returned $code"
            exit 1
          fi

      - name: Check download site
        if: ${{ vars.SITE_URL != '' }}
        run: |
          # SITE_URL 可以带 ?sharecode=xxx：部分托管平台只允许带分享码的入口访问。
          code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 30 "${{ vars.SITE_URL }}" || echo 000)
          echo "site_http=$code"
          if [ "$code" != "200" ]; then
            echo "::error::Site returned $code"
            exit 1
          fi

          # 页面里必须能读到版本号，否则说明 releases.json 丢了或页面挂了
          html=$(curl -sL --max-time 30 "${{ vars.SITE_URL }}" || echo "")
          if ! echo "$html" | grep -q 'releases.json'; then
            echo "::error::index.html 没有引用 releases.json"
            exit 1
          fi
          echo "site ok"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '每日检查失败：下载链接或下载站不可用';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'site-check',
            });
            if (issues.some(i => i.title === title)) {
              console.log('已有同类 issue，跳过');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['site-check'],
              body: [
                '定时检查发现异常，请查看 Actions 运行日志：',
                '',
                `- 运行记录：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '常见原因：Release 资产被删、站点到期、`releases.json` 丢失。',
              ].join('\n'),
            });
